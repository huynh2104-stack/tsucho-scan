<title>通帳スキャン — màn hình đối chiếu (bản mẫu)</title>

<style>
/* ─────────────────────────────────────────────────────────────
   Bản mẫu màn hình đối chiếu ảnh ↔ bảng — docs/WEB_PLAN.md §7
   Màu trạng thái lấy ĐÚNG từ export.py để web và Excel cùng một bộ mặt.
   ───────────────────────────────────────────────────────────── */
:root {
  --sans: "Segoe UI", "Yu Gothic UI", "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, sans-serif;
  --mono: "Cascadia Mono", "SFMono-Regular", Consolas, "MS Gothic", monospace;

  --page:  #EEF2F6;
  --card:  #FFFFFF;
  --ink:   #16222E;
  --ink-2: #5A6A7A;
  --ink-3: #8A98A6;
  --rule:  #DCE3E9;
  --rule-2:#EAEFF3;

  --accent:     #2F5B7C;   /* = HEADER_FILL trong export.py */
  --accent-mid: #4A7EA5;
  --accent-pale:#E3ECF3;

  --warn-bg:  #FFF2CC;     /* = UNCERTAIN */
  --warn-ink: #7A5400;
  --warn-edge:#E0BC66;

  --ok-bg:  #C6EFCE;       /* = FIXED_FILL */
  --ok-ink: #1B5E36;
  --ok-edge:#8CCBA0;

  --paper:  #FBF8F1;
  --paper-rule: #C9D3D8;
  --paper-ink:  #24404F;
  --mark:   #C0392B;       /* khung soát — mực bút đỏ */
  --shadow: 0 1px 2px rgba(22,34,46,.06), 0 8px 24px rgba(22,34,46,.08);
}

@media (prefers-color-scheme: dark) {
  :root {
    --page:  #0E161D;
    --card:  #17222C;
    --ink:   #E7EEF4;
    --ink-2: #97A8B7;
    --ink-3: #6F8091;
    --rule:  #26343F;
    --rule-2:#1E2A34;
    --accent:     #6FA6CE;
    --accent-mid: #8FBEDE;
    --accent-pale:#1D3040;
    --warn-bg:  #453712;
    --warn-ink: #F0D28C;
    --warn-edge:#7E651F;
    --ok-bg:  #17402A;
    --ok-ink: #A5DDB8;
    --ok-edge:#2E6B47;
    --paper:  #E8E4DC;       /* bản scan vẫn là giấy, chỉ dịu đi */
    --paper-rule: #A9B4BA;
    --paper-ink:  #1E3744;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"] {
  --page:#0E161D; --card:#17222C; --ink:#E7EEF4; --ink-2:#97A8B7; --ink-3:#6F8091;
  --rule:#26343F; --rule-2:#1E2A34; --accent:#6FA6CE; --accent-mid:#8FBEDE;
  --accent-pale:#1D3040; --warn-bg:#453712; --warn-ink:#F0D28C; --warn-edge:#7E651F;
  --ok-bg:#17402A; --ok-ink:#A5DDB8; --ok-edge:#2E6B47; --paper:#E8E4DC;
  --paper-rule:#A9B4BA; --paper-ink:#1E3744;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45);
}
:root[data-theme="light"] {
  --page:#EEF2F6; --card:#FFFFFF; --ink:#16222E; --ink-2:#5A6A7A; --ink-3:#8A98A6;
  --rule:#DCE3E9; --rule-2:#EAEFF3; --accent:#2F5B7C; --accent-mid:#4A7EA5;
  --accent-pale:#E3ECF3; --warn-bg:#FFF2CC; --warn-ink:#7A5400; --warn-edge:#E0BC66;
  --ok-bg:#C6EFCE; --ok-ink:#1B5E36; --ok-edge:#8CCBA0; --paper:#FBF8F1;
  --paper-rule:#C9D3D8; --paper-ink:#24404F;
  --shadow:0 1px 2px rgba(22,34,46,.06), 0 8px 24px rgba(22,34,46,.08);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: var(--sans);
  background: var(--page);
  color: var(--ink);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ── ruy băng nhắc đây là bản mẫu ─────────────────────────── */
.ribbon {
  background: repeating-linear-gradient(135deg, var(--accent-pale) 0 12px, transparent 12px 24px);
  border-bottom: 1px solid var(--rule);
  color: var(--ink-2);
  font-size: 12.5px;
  letter-spacing: .04em;
  padding: 7px 20px;
  text-align: center;
}
.ribbon b { color: var(--ink); font-weight: 600; }

/* ── thanh trên ────────────────────────────────────────────── */
.topbar {
  display: flex; align-items: center; gap: 18px;
  padding: 12px 20px;
  background: var(--card);
  border-bottom: 1px solid var(--rule);
  flex-wrap: wrap;
}
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand .mark {
  font-size: 19px; font-weight: 700; letter-spacing: .02em; color: var(--accent);
}
.brand .sub {
  font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3);
}
.filechip {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 14px; color: var(--ink-2);
  border: 1px solid var(--rule); border-radius: 6px;
  padding: 5px 11px; background: var(--page);
}
.filechip::before {
  content: ""; width: 7px; height: 9px; border: 1.5px solid var(--ink-3);
  border-radius: 1px; display: inline-block;
}
.grow { flex: 1 1 auto; }

/* huy hiệu mức độ bảo đảm — thứ phải nhìn thấy đầu tiên */
.verify {
  display: inline-flex; align-items: center; gap: 9px;
  padding: 6px 13px; border-radius: 999px;
  font-size: 14px; font-weight: 600;
  border: 1px solid var(--warn-edge); background: var(--warn-bg); color: var(--warn-ink);
  transition: background .25s, color .25s, border-color .25s;
}
.verify.clean { border-color: var(--ok-edge); background: var(--ok-bg); color: var(--ok-ink); }
.verify .dot {
  width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none;
}

/* chuyển ngôn ngữ */
.langs { display: inline-flex; border: 1px solid var(--rule); border-radius: 7px; overflow: hidden; }
.langs button {
  font: inherit; font-size: 13px; padding: 6px 12px;
  background: var(--card); color: var(--ink-2);
  border: 0; border-right: 1px solid var(--rule); cursor: pointer;
}
.langs button:last-child { border-right: 0; }
.langs button[aria-pressed="true"] { background: var(--accent); color: #fff; font-weight: 600; }
.langs button:hover:not([aria-pressed="true"]) { background: var(--accent-pale); color: var(--ink); }

.btn {
  font: inherit; font-size: 14px; font-weight: 600;
  padding: 8px 16px; border-radius: 7px; cursor: pointer;
  border: 1px solid var(--accent); background: var(--accent); color: #fff;
}
.btn.ghost { background: transparent; color: var(--accent); }
.btn:hover { filter: brightness(1.08); }
:focus-visible { outline: 2px solid var(--accent-mid); outline-offset: 2px; }

/* ── bố cục chia đôi ───────────────────────────────────────── */
.split {
  display: grid;
  grid-template-columns: minmax(280px, 44fr) 6px minmax(320px, 56fr);
  height: calc(100vh - 106px);
  min-height: 560px;
}
.divider { background: var(--rule); cursor: col-resize; }
.divider:hover { background: var(--accent-mid); }

.pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--card); }
.pane-head {
  display: flex; align-items: center; gap: 12px;
  padding: 9px 16px; border-bottom: 1px solid var(--rule-2);
  font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3);
}
.pane-head .grow { flex: 1; }

/* ── ảnh sổ ────────────────────────────────────────────────── */
.imgwrap { flex: 1; overflow: auto; padding: 26px; background: var(--page); }
.paperzoom { transform-origin: top center; transition: transform .18s ease; }
.paper {
  position: relative;
  width: 560px; margin: 0 auto;
  background: var(--paper);
  border: 1px solid var(--paper-rule);
  box-shadow: var(--shadow);
  transform: rotate(-.35deg);
  padding: 18px 16px 26px;
  color: var(--paper-ink);
  font-family: var(--mono);
}
.paper::after {   /* vệt sáng của bản scan */
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(115deg, rgba(255,255,255,.5), transparent 34%, rgba(80,90,70,.07) 88%);
}
.paper-title {
  font-family: var(--sans); font-size: 13px; letter-spacing: .22em;
  color: var(--paper-ink); opacity: .75; margin-bottom: 12px; text-align: center;
}
.paper-head, .paper-row {
  display: grid;
  grid-template-columns: 26px 62px 1fr 84px 84px 96px;
  gap: 6px; align-items: center;
  font-size: 12.5px;
  padding: 0 4px;
}
.paper-head {
  font-family: var(--sans); font-size: 10.5px; letter-spacing: .06em;
  border-bottom: 1.5px solid var(--paper-rule);
  padding-bottom: 5px; margin-bottom: 2px; opacity: .8;
}
.paper-row {
  height: 26px;
  border-bottom: 1px solid color-mix(in srgb, var(--paper-rule) 55%, transparent);
  cursor: pointer;
}
.paper-row .num { font-size: 10px; opacity: .55; }
.paper-row .amt { text-align: right; letter-spacing: -.02em; }
.paper-row .desc { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.paper-row.note { opacity: .6; font-style: italic; }

/* khung soát bám dòng đang chọn */
.mark {
  position: absolute; left: 12px; right: 12px; height: 26px;
  border: 2px solid var(--mark); border-radius: 3px;
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--mark) 16%, transparent);
  transition: top .22s cubic-bezier(.4,.9,.3,1), opacity .2s;
  pointer-events: none;
}
.mark::before {
  content: attr(data-n);
  position: absolute; left: -2px; top: -20px;
  background: var(--mark); color: #fff;
  font-family: var(--sans); font-size: 10.5px; font-weight: 700;
  letter-spacing: .06em; padding: 1px 7px; border-radius: 3px 3px 0 0;
}

.zoombar { display: flex; align-items: center; gap: 6px; padding: 8px 16px; border-top: 1px solid var(--rule-2); }
.zoombar button {
  font: inherit; font-size: 14px; width: 32px; height: 30px;
  border: 1px solid var(--rule); background: var(--card); color: var(--ink-2);
  border-radius: 6px; cursor: pointer;
}
.zoombar button:hover { background: var(--accent-pale); color: var(--ink); }
.zoombar .pageno { margin-left: auto; font-size: 13px; color: var(--ink-3); }

/* ── bảng ──────────────────────────────────────────────────── */
.tablewrap { flex: 1; overflow: auto; }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
thead th {
  position: sticky; top: 0; z-index: 2;
  background: var(--accent); color: #fff;
  text-align: left; font-weight: 600; font-size: 13.5px;
  padding: 8px 10px; white-space: nowrap;
  border-right: 1px solid rgba(255,255,255,.16);
}
thead th .gloss {
  display: block; font-size: 10.5px; font-weight: 400;
  letter-spacing: .04em; opacity: .78; margin-top: 1px;
}
thead th .gloss:empty { display: none; }   /* tiếng Nhật không cần chú thích */
thead th.num, tbody td.num { text-align: right; }
tbody td {
  padding: 0 10px; height: 38px;
  border-bottom: 1px solid var(--rule-2);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
tbody tr { cursor: pointer; }
tbody tr:hover td { background: color-mix(in srgb, var(--accent-pale) 55%, transparent); }
tbody tr.sel td { background: var(--accent-pale); }
tbody tr.sel td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
tbody tr.note td { color: var(--ink-3); font-style: italic; }
td.gutter { color: var(--ink-3); font-size: 12px; text-align: right; width: 40px; font-variant-numeric: tabular-nums; }

/* ô sửa được — trông như chữ thường cho tới khi bấm vào */
td input {
  font: inherit; font-variant-numeric: tabular-nums;
  width: 100%; height: 30px; padding: 0 6px;
  border: 1px solid transparent; border-radius: 4px;
  background: transparent; color: inherit; text-align: right;
}
td.desc input { text-align: left; letter-spacing: .01em; }
td input:hover { border-color: var(--rule); }
td input:focus { border-color: var(--accent); background: var(--card); outline: none; }

td.flag input, td.flag { background: var(--warn-bg); color: var(--warn-ink); }
td.fixed input, td.fixed { background: var(--ok-bg); color: var(--ok-ink); }

.chk { font-size: 12px; letter-spacing: .04em; color: var(--ink-3); text-align: center; }
.chk.ng { color: var(--warn-ink); font-weight: 700; }
.chk.ok { color: var(--ok-ink); }

/* dòng ghi chú lý do, chỉ hiện ở dòng đang chọn hoặc dòng có cờ */
tr.memo td {
  height: auto; padding: 5px 10px 8px 50px;
  font-size: 13px; white-space: normal; border-bottom: 1px solid var(--rule-2);
}
.memo-warn { color: var(--warn-ink); }
.memo-fix  { color: var(--ok-ink); }
.memo b { font-weight: 600; }
.undo {
  font: inherit; font-size: 12px; margin-left: 8px;
  background: transparent; border: 1px solid currentColor; color: inherit;
  border-radius: 5px; padding: 1px 8px; cursor: pointer;
}

/* ── thanh điều hướng lỗi ──────────────────────────────────── */
.navbar {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 16px; border-top: 1px solid var(--rule);
  background: var(--card); flex-wrap: wrap;
}
.navbar .count { font-size: 14px; font-weight: 600; color: var(--warn-ink); }
.navbar .count.clean { color: var(--ok-ink); }
.navbar .hint { margin-left: auto; font-size: 12.5px; color: var(--ink-3); }
kbd {
  font-family: var(--mono); font-size: 11.5px;
  border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 4px;
  padding: 1px 6px; background: var(--page); color: var(--ink-2);
}
.navbtn {
  font: inherit; font-size: 13.5px; font-weight: 600;
  padding: 7px 13px; border-radius: 7px; cursor: pointer;
  border: 1px solid var(--rule); background: var(--card); color: var(--ink);
}
.navbtn:hover { border-color: var(--accent); color: var(--accent); }
.navbtn:disabled { opacity: .4; cursor: not-allowed; }

/* lời nhắc giới hạn — không bao giờ giấu */
.caveat {
  padding: 10px 20px; font-size: 13px; color: var(--ink-2);
  background: var(--page); border-top: 1px solid var(--rule);
  display: flex; gap: 9px; align-items: flex-start;
}
.caveat .ic { color: var(--accent); font-weight: 700; }

@media (max-width: 900px) {
  .split { grid-template-columns: 1fr; grid-template-rows: 40vh 6px 1fr; height: auto; }
  .divider { cursor: row-resize; }
  .paper { width: 100%; min-width: 460px; }
  .imgwrap { padding: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>

<div class="ribbon">

"use strict";

/* ── Dữ liệu mẫu: chuỗi số dư có thật, có 1 dòng máy tự sửa và 2 dòng lệch ── */

  { n: "07", d: "05-15", desc: "証貸 2月",                  out: 155000, inc: null,   bal: 1440429 },
  { n: "08", d: "05-20", desc: "振込 フクオカシギヨウシヤシ",  out: null,   inc: 96800,  bal: 1537229 },
  { n: "09", d: "05-25", desc: "デンキリヨウキン",            out: 12340,  inc: null,   bal: 1524889 },

];

/* ── Chữ giao diện. Tên cột KHÔNG dịch — xem WEB_PLAN §8 ── */
const T = {
  vi: {
    tagline: "Đối chiếu", excel: "Tải Excel",
    paneImage: "Ảnh gốc", paneTable: "Dữ liệu đọc được", pageNo: "Trang 5 / 24",
    cDate: "Ngày", cDesc: "Nội dung", cOut: "Tiền ra", cIn: "Tiền vào",
    cBal: "Số dư", cChk: "Kiểm",
    prevErr: "Dòng cần soát trước", nextErr: "Dòng cần soát sau",
    hintMove: "chuyển dòng", hintJump: "nhảy tới dòng cần soát",
    count: n => n ? `Còn ${n} dòng cần soát` : "Đã soát hết",
    verifyWarn: n => `Một phần chưa kiểm chứng (${n} dòng)`,
    verifyOk: "Đã kiểm chứng bằng chuỗi số dư",
    memoBal: d => `Số dư không khớp (lệch ${d}). Máy chỉ báo được chỗ lệch, số đúng phải nhìn ảnh.`,
    memoKana: "Tên katakana dễ đọc sai — hãy đối chiếu với ảnh.",
    memoFix: (a, b) => `Máy tự sửa: ${a} → ${b} (dựa vào chuỗi số dư).`,
    undo: "Hoàn tác",
    caveat: "Chuỗi số dư chỉ chứng minh các con số khớp nhau. Nó KHÔNG phát hiện được dòng bị bỏ sót hay tên đối tác đọc sai — hai lỗi đó vẫn phải soát bằng mắt.",
  },
  en: {
    tagline: "Review", excel: "Download Excel",
    paneImage: "Source image", paneTable: "Extracted data", pageNo: "Page 5 / 24",
    cDate: "Date", cDesc: "Description", cOut: "Debit", cIn: "Credit",
    cBal: "Balance", cChk: "Check",
    prevErr: "Previous flagged row", nextErr: "Next flagged row",
    hintMove: "move row", hintJump: "jump to flagged row",
    count: n => n ? `${n} row${n > 1 ? "s" : ""} left to review` : "All rows reviewed",
    verifyWarn: n => `Partially verified (${n} rows)`,
    verifyOk: "Verified by balance chain",
    memoBal: d => `Balance does not add up (off by ${d}). The tool can point at the gap, not fix it — check the image.`,
    memoKana: "Katakana names are easily misread — compare with the image.",
    memoFix: (a, b) => `Auto-corrected: ${a} → ${b} (from the balance chain).`,
    undo: "Undo",
    caveat: "The balance chain only proves the numbers agree with each other. It CANNOT detect a skipped row or a misread name — those still need your eyes.",
  },
  ja: {
    tagline: "照合", excel: "Excel ダウンロード",
    paneImage: "原本画像", paneTable: "読取り結果", pageNo: "5 / 24 ページ",
    cDate: "", cDesc: "", cOut: "", cIn: "", cBal: "", cChk: "",
    prevErr: "前の要確認行", nextErr: "次の要確認行",
    hintMove: "行移動", hintJump: "要確認行へ",
    count: n => n ? `要確認 残り ${n} 行` : "確認済み",
    verifyWarn: n => `一部未検証（${n}行が要確認）`,
    verifyOk: "残高チェーン検証済（全行一致）",
    memoBal: d => `残高不一致（差額 ${d}）。差異の位置は分かりますが、正しい数字は画像で確認してください。`,
    memoKana: "カタカナ名は誤読しやすい項目です。画像と照合してください。",
    memoFix: (a, b) => `自動修正：${a} → ${b}（残高チェーンによる）。`,
    undo: "取消",
    caveat: "残高チェーンは数字の整合性のみを示します。行の欠落や摘要の誤読は検出できません — その二つは目視確認が必要です。",
  },
};

let lang = "vi";
let sel = 1;
let rows = ROWS.map(r => ({ ...r }));
let zoom = 1, rot = 0;

const yen = v => v == null ? "" : v.toLocaleString("en-US");
const $ = id => document.getElementById(id);

/* Trạng thái từng dòng: tính lại mỗi lần sửa — đúng như cột 残高チェック sống trong Excel */
function computeStates() {
  let prev = null;
  return rows.map(r => {
    let chk = "—", bad = false;
    if (r.bal != null) {
      if (prev != null) {
        const want = prev - (r.out || 0) + (r.inc || 0);
        bad = want !== r.bal;
        chk = bad ? "NG" : "OK";
      }
      prev = r.bal;
    }
    return { chk, bad, flagged: bad || (r.kana && !r.kanaOk) };
  });
}

function deltaOf(i) {
  let prev = null;
  for (let k = 0; k < i; k++) if (rows[k].bal != null) prev = rows[k].bal;
  if (prev == null || rows[i].bal == null) return 0;
  return rows[i].bal - (prev - (rows[i].out || 0) + (rows[i].inc || 0));
}

function render() {
  const t = T[lang];
  const st = computeStates();
  const nFlag = st.filter(s => s.flagged).length;

  /* ảnh sổ */
  $("paperRows").innerHTML = rows.map((r, i) => `
    <div class="paper-row${r.note ? " note" : ""}" data-i="${i}">
      <span class="num">${r.n}</span><span>${r.d}</span>
      <span class="desc">${r.desc}</span>
      <span class="amt">${yen(r.out)}</span>
      <span class="amt">${yen(r.inc)}</span>
      <span class="amt">${yen(r.bal)}</span>
    </div>`).join("");

  /* bảng */
  $("tbody").innerHTML = rows.map((r, i) => {
    const s = st[i];
    const kanaFlag = r.kana && !r.kanaOk;
    let memo = "";
    if (i === sel || s.flagged) {
      if (s.bad) {
        const d = deltaOf(i);
        memo = `<span class="memo-warn">⚠ ${t.memoBal((d > 0 ? "+" : "") + yen(d))}</span>`;
      }
      else if (kanaFlag) memo = `<span class="memo-warn">⚠ ${t.memoKana}</span>`;
      else if (r.fixed && !r.undone) memo =
        `<span class="memo-fix">✓ ${t.memoFix(r.fixedFrom, r.fixedTo)}` +
        `<button class="undo" data-undo="${i}">${t.undo}</button></span>`;
    }
    const fixCls = r.fixed && !r.undone ? " fixed" : "";
    return `
      <tr class="${i === sel ? "sel" : ""}${r.note ? " note" : ""}" data-i="${i}">
        <td class="gutter">${r.n}</td>
        <td>${r.d}</td>
        <td class="desc${kanaFlag ? " flag" : ""}">
          <input value="${r.desc}" data-i="${i}" data-f="desc" aria-label="摘要">
        </td>
        <td class="num${fixCls}">${yen(r.out)}</td>
        <td class="num${fixCls}">${yen(r.inc)}</td>
        <td class="num${s.bad ? " flag" : ""}">
          <input value="${yen(r.bal)}" data-i="${i}" data-f="bal" aria-label="差引残高" inputmode="numeric">
        </td>
        <td class="chk ${s.chk === "NG" ? "ng" : s.chk === "OK" ? "ok" : ""}">${s.chk}</td>
      </tr>
      ${memo ? `<tr class="memo" data-i="${i}"><td colspan="7">${memo}</td></tr>` : ""}`;
  }).join("");

  /* huy hiệu + bộ đếm */
  $("verifyText").textContent = nFlag ? t.verifyWarn(nFlag) : t.verifyOk;
  $("verify").classList.toggle("clean", nFlag === 0);
  $("count").textContent = t.count(nFlag);
  $("count").classList.toggle("clean", nFlag === 0);
  $("prevErr").disabled = $("nextErr").disabled = nFlag === 0;

  moveMark();
}

function moveMark() {
  const row = document.querySelector(`.paper-row[data-i="${sel}"]`);
  const mk = $("mark");
  if (!row) { mk.style.opacity = 0; return; }
  mk.style.opacity = 1;
  mk.style.top = row.offsetTop + "px";
  mk.dataset.n = rows[sel].n ? "行 " + rows[sel].n : "繰越";
  row.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

function select(i, focusField) {
  sel = Math.max(0, Math.min(rows.length - 1, i));
  render();
  const tr = document.querySelector(`tr[data-i="${sel}"]`);
  if (tr) tr.scrollIntoView({ block: "nearest" });
  if (focusField) {
    const el = document.querySelector(`input[data-i="${sel}"][data-f="${focusField}"]`);
    if (el) { el.focus(); el.select(); }
  }
}

function jumpFlag(dir) {
  const st = computeStates();
  for (let k = 1; k <= rows.length; k++) {
    const i = (sel + dir * k + rows.length * 2) % rows.length;
    if (st[i].flagged) {
      select(i, st[i].bad ? "bal" : "desc");
      return;
    }
  }
}

/* ── sự kiện ─────────────────────────────────────────────── */
$("tbody").addEventListener("click", e => {
  const undo = e.target.closest("[data-undo]");
  if (undo) {
    const i = +undo.dataset.undo;
    const r = rows[i];
    [r.out, r.inc] = [r.inc, r.out];      // trả lại đúng cột model đọc ban đầu
    r.undone = true;
    render();
    return;
  }
  const tr = e.target.closest("tr[data-i]");
  if (tr && !tr.classList.contains("memo")) select(+tr.dataset.i);
});

$("tbody").addEventListener("input", e => {
  const el = e.target;
  if (!el.dataset || !el.dataset.f) return;
  const i = +el.dataset.i, f = el.dataset.f;
  const caret = el.selectionStart;
  if (f === "bal") {
    const v = el.value.replace(/[^\d-]/g, "");
    rows[i].bal = v === "" ? null : parseInt(v, 10);
  } else {
    rows[i].desc = el.value;
    rows[i].kanaOk = true;               // người dùng đã xác nhận tên
  }
  sel = i;
  render();
  const again = document.querySelector(`input[data-i="${i}"][data-f="${f}"]`);
  if (again) { again.focus(); try { again.setSelectionRange(caret, caret); } catch (_) {} }
});

$("paperRows").addEventListener("click", e => {
  const r = e.target.closest(".paper-row");
  if (r) select(+r.dataset.i);
});

document.addEventListener("keydown", e => {
  const typing = e.target.tagName === "INPUT";
  if (e.key === "ArrowDown") { e.preventDefault(); select(sel + 1, typing ? e.target.dataset.f : null); }
  else if (e.key === "ArrowUp") { e.preventDefault(); select(sel - 1, typing ? e.target.dataset.f : null); }
  else if (!typing && (e.key === "n" || e.key === "N")) jumpFlag(1);
  else if (!typing && (e.key === "p" || e.key === "P")) jumpFlag(-1);
  else if (!typing && (e.key === "+" || e.key === "=")) setZoom(zoom + .15);
  else if (!typing && e.key === "-") setZoom(zoom - .15);
  else if (!typing && e.key === "0") setZoom(1);
  else if (!typing && (e.key === "r" || e.key === "R")) rotate();
});

$("nextErr").addEventListener("click", () => jumpFlag(1));
$("prevErr").addEventListener("click", () => jumpFlag(-1));

function setZoom(z) {
  zoom = Math.max(.6, Math.min(2.4, z));
  $("paperzoom").style.transform = `scale(${zoom}) rotate(${rot}deg)`;
}
function rotate() { rot = (rot + 90) % 360; setZoom(zoom); }
$("zoomIn").addEventListener("click", () => setZoom(zoom + .15));
$("zoomOut").addEventListener("click", () => setZoom(zoom - .15));
$("zoomFit").addEventListener("click", () => setZoom(1));
$("rotate").addEventListener("click", rotate);

$("imgwrap").addEventListener("wheel", e => {
  if (!e.ctrlKey) return;
  e.preventDefault();
  setZoom(zoom + (e.deltaY < 0 ? .1 : -.1));
}, { passive: false });

/* chuyển ngôn ngữ */
document.querySelectorAll(".langs button").forEach(b => {
  b.addEventListener("click", () => {
    lang = b.dataset.lang;
    document.querySelectorAll(".langs button").forEach(o =>
      o.setAttribute("aria-pressed", String(o === b)));
    applyStatic();
    render();
  });
});

function applyStatic() {
  const t = T[lang];
  document.querySelectorAll("[data-t]").forEach(el => {
    const v = t[el.dataset.t];
    if (typeof v === "string") el.textContent = v;
  });
  document.documentElement.lang = lang;
}

/* thanh kéo chia đôi */
(function () {
  let dragging = false;
  $("divider").addEventListener("mousedown", () => { dragging = true; document.body.style.userSelect = "none"; });
  window.addEventListener("mouseup", () => { dragging = false; document.body.style.userSelect = ""; });
  window.addEventListener("mousemove", e => {
    if (!dragging || window.innerWidth <= 900) return;
    const pct = Math.max(24, Math.min(70, e.clientX / window.innerWidth * 100));
    $("split").style.gridTemplateColumns = `${pct}fr 6px ${100 - pct}fr`;
  });
})();

applyStatic();
render();
</script>
